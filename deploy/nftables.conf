#!/usr/sbin/nft -f
# /etc/nftables.conf — firewall for the LotoWriter PC when ufw isn't available
# (e.g. Debian / Radxa OS). Allows the app on port 80 to everyone on the Wi-Fi,
# SSH only from the admin subnet, and blocks everything else coming in.
# Change 192.168.2.0/24 below to your network. See deploy/INSTALL.md step 7.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    udp sport 67 udp dport 68 accept               # DHCP replies
    tcp dport 80 accept                            # LotoWriter
    ip saddr 192.168.2.0/24 tcp dport 22 accept    # SSH from the admin subnet only
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
